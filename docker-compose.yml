services:
  db:
    image: postgres:15-alpine
    container_name: dna-prod-db
    environment:
      POSTGRES_USER: dna_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dna_analysis
    volumes:
      - ./runtime/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dna_user -d dna_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - ./runtime/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: dna_database-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dna-prod-web
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dna_analysis
      DB_USER: dna_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      BASE_URL: ${FRONTEND_URL:-http://localhost:3001}
      DISABLE_HTTPS_REDIRECT: "true"
      ENABLE_SSL: "false"
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./runtime/uploads:/app/uploads
      - ./runtime/exports:/app/exports
      - ./runtime/backups:/app/backups
      - ./config/encryption.key:/app/config/encryption.key:ro
    restart: unless-stopped
